; Fronts & Rivals 1.0 settings.
; Change a value, save, and restart the game (or reload scripts). Bad values fall back to the default
; and are noted in scripts\FrontsAndRivals\FrontsAndRivals.log.
; Settings marked [Office] can also be changed in game under The Office > Settings; that choice wins.

[General]
; true/false: turn the whole mod on or off.
Enabled=true
; A keyboard key that opens the Office, e.g. F7. None = phone contact only (call "The Office").
OfficeHotkey=None
; Controller: true = HOLD the Interaction Menu button (Back/View on a gamepad, M on keyboard) for half a
; second to open or close the Office, like GTA Online. A quick tap still changes the camera view.
OfficeButton=true
; true: start with the car wash, 2 recruits posted and the Broker's message already done (for reinstalls).
SkipIntro=false

[Attacks]
; [Office] How often rival crews come for your fronts: Off, Low (~75 min), Normal (~45 min), High (~25 min).
Frequency=Normal
; Minutes between attacks, overriding Frequency. 0 = use Frequency. (Frequency=Off still means no attacks.)
CooldownMinutes=0
; No attacks for this many minutes after you load a game.
FirstAttackDelayMinutes=10
; In-game hours of warning before an attack (1 in-game hour = 2 real minutes). Cameras and Lookouts add more.
WarningHours=3
; [Office] true: attacks become fights when you're within 300 m. false: they always resolve on their own.
LiveDefense=true
; true: police are sent after the attacking crew during a live defense.
PoliceRespond=true
; true: the more fronts you hold, the sooner and bigger the attacks. Past 3 fronts the wait between attacks
; shrinks (Normal: ~35 min at 10 fronts, ~30 at 15, 25 at 23+) and squads get +1 at 6, 12 and 20 fronts.
; An exact CooldownMinutes above is kept as set. false: the same pace however big you get.
EmpirePressure=true

[Turf]
; [Office] How often crews grab fronts that are for sale and fight each other at night: Off, Low, Normal, High.
Frequency=Normal

[Rivals]
; Metres from a rival front's door at which, on foot, its soldiers notice you and fight (once you own a front of your own;
; before that they leave you alone unless you hurt one). They ignore you driving past.
AlertRange=35

[Notifications]
; [Office] All: everything. Important: no taunts or street gossip. Minimal: attacks and fronts changing hands only.
Level=All
; Seconds between messages, so they never pile up. Important ones jump the queue. 0 = no gap.
MinSecondsBetween=20
; Texts from Showboat crew leaders before and after attacks.
Taunts=true
; Gossip about crews taking fronts from each other.
StreetWord=true
; The nightly "Midnight take" message with income and wages.
MidnightReport=true

[Sound]
; [Office] true: the mod plays the game's own alert and cash sounds (attack warnings, purchases, the midnight take).
Effects=true

[Economy]
; Multiply all front income / all guard wages, e.g. 1.5 = 50% more.
IncomeMultiplier=1.0
WageMultiplier=1.0
; A front for sale costs this many days of its income. The starter car wash is always $25,000.
FrontPriceDays=5

[Guards]
; [Office] true: guards who die are gone for good. false: deaths become injuries (back in two in-game days).
; The Office switch can only turn permanent death off, never on when this is false.
PermanentDeath=true
; true: fronts can't be lost. A failed defense costs that front one night's income, and deaths become injuries.
ProtectedMode=false

[Map]
; Show fronts held by rival crews, in their crew's colour.
ShowRivalFronts=true
; Show fronts that are for sale, in white.
ShowForSaleFronts=true
; true: staff (a cashier, a janitor, a bartender) work at the front you're standing near. false: guards only.
FrontStaff=true

[Debug]
; true turns on F9 (copy position), F10 (dev menu) and the entity counter. Leave false for normal play.
DevTools=false
