; Fronts & Rivals settings. Defaults from design doc v1.0.
; Balance values live here so you can tune without recompiling.

[General]
Enabled=true
; Optional hotkey for the Office menu. None = phone contact and HQ door only.
OfficeHotkey=None

[Attacks]
; Off, Low, Normal, High
Frequency=Normal
WarningHours=3
