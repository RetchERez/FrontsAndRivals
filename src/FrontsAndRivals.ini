; Fronts & Rivals settings. Defaults from design doc v1.0.
; Balance values live here so you can tune without recompiling.

[General]
Enabled=true
; Optional key for the Office menu, e.g. F7. None = phone contact only (call "The Office").
OfficeHotkey=None
; Start with the car wash, 2 recruits and the Broker's message done (for reinstalls).
SkipIntro=false

[Attacks]
; Off, Low, Normal, High
Frequency=Normal
WarningHours=3
PoliceRespond=true

[Economy]
IncomeMultiplier=1.0
WageMultiplier=1.0

[Guards]
PermanentDeath=true
; Fronts can't be lost: a failed defense damages the front for a night instead, and deaths become injuries.
ProtectedMode=false

[Map]
ShowRivalFronts=true

[Debug]
; true turns on F9 (copy position), F10 (dev menu) and the entity counter
DevTools=false
